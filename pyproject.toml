[project]
name = "pulse-local"
version = "0.1.0"
description = "A local live speech-to-sentiment demonstration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "huggingface-hub>=1.32.0",
    "safetensors>=0.8.0",
    "torch>=2.6",
    "transformers>=5",
    "uvicorn>=0.30",
    "websockets>=13",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
